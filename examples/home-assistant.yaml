# secrets.yaml
# ezviz_cp2_api_key: "replace-with-the-same-long-random-value-used-in-the-app"

rest_command:
  ezviz_cp2_capture:
    url: "http://HOME_ASSISTANT_IP:8099/capture"
    method: POST
    timeout: 10
    headers:
      X-API-Key: !secret ezviz_cp2_api_key
      Content-Type: "application/json"
    payload: >
      {
        "duration": {{ duration | default(60) }},
        "name": "{{ name }}"
      }

  ezviz_cp2_status:
    url: "http://HOME_ASSISTANT_IP:8099/status"
    method: GET
    timeout: 10
    headers:
      X-API-Key: !secret ezviz_cp2_api_key

# Example automation: replace all entity IDs and the Telegram config entry ID.
automation:
  - alias: "Security - record entrance and send CP2 snapshot"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.front_door_vibration
        to: "on"
    conditions:
      - condition: template
        value_template: >
          {{ states('alarm_control_panel.home_alarm') in
             ['armed_away', 'armed_home', 'armed_night', 'armed_vacation'] }}
    variables:
      stamp: "{{ now().strftime('%Y%m%d_%H%M%S') }}"
      cp2_snapshot: "/media/intrusioni/{{ stamp }}_cp2.jpg"
    actions:
      - action: telegram_bot.send_message
        continue_on_error: true
        data:
          config_entry_id: YOUR_TELEGRAM_CONFIG_ENTRY_ID
          title: "ATTENZIONE!"
          message: "Tentativo di ingresso dalla porta principale!"

      - parallel:
          - sequence:
              - action: rest_command.ezviz_cp2_capture
                data:
                  duration: 60
                  name: "{{ stamp }}"
                response_variable: cp2_response

              - if:
                  - condition: template
                    value_template: "{{ cp2_response.status == 202 }}"
                then:
                  - repeat:
                      count: 8
                      sequence:
                        - delay:
                            seconds: 5
                        - action: rest_command.ezviz_cp2_status
                          response_variable: cp2_status
                        - if:
                            - condition: template
                              value_template: >
                                {{ cp2_status.status == 200
                                   and cp2_status.content.state in ['recording', 'completed', 'failed'] }}
                          then:
                            - stop: "CP2 startup finished"
                              response_variable: cp2_status

                  - if:
                      - condition: template
                        value_template: >
                          {{ cp2_status is defined
                             and cp2_status.status == 200
                             and cp2_status.content.state in ['recording', 'completed']
                             and cp2_status.content.snapshot == cp2_snapshot }}
                    then:
                      - action: telegram_bot.send_photo
                        data:
                          config_entry_id: YOUR_TELEGRAM_CONFIG_ENTRY_ID
                          file: "{{ cp2_snapshot }}"
                          caption: >
                            Spioncino CP2 — {{ now().strftime('%d/%m/%Y alle %H:%M:%S') }}
                    else:
                      - action: telegram_bot.send_message
                        continue_on_error: true
                        data:
                          config_entry_id: YOUR_TELEGRAM_CONFIG_ENTRY_ID
                          title: "Errore CP2"
                          message: >
                            Snapshot CP2 non disponibile.
                            Stato: {{ cp2_status.content.state | default('sconosciuto') }}
                else:
                  - action: telegram_bot.send_message
                    continue_on_error: true
                    data:
                      config_entry_id: YOUR_TELEGRAM_CONFIG_ENTRY_ID
                      title: "Errore CP2"
                      message: >
                        Il recorder non ha accettato la richiesta. HTTP:
                        {{ cp2_response.status | default('sconosciuto') }}

          - action: camera.record
            continue_on_error: true
            target:
              entity_id: camera.indoor_entrance
            data:
              filename: "/media/intrusioni/{{ stamp }}_indoor.mp4"
              duration: 60
              lookback: 10
